# Based on OGP's shared config (opengovsg/codeql-config@prod), with one change:
# OGP's custom query packs (opengovsg/*-custom-queries) are private to the opengovsg
# org and can't be downloaded from a personal repo (403 on ghcr.io), so this uses
# GitHub's security-extended suite instead. Filters and ignored paths match OGP's.
name: 'CodeQL config'

queries:
  - uses: security-extended

query-filters:
  - exclude:
      id: js/hardcoded-credentials # covered by the gitleaks secret-scan workflow
  - exclude:
      id: js/missing-rate-limiting
  - exclude:
      id: js/missing-token-validation
  - exclude:
      id: actions/missing-workflow-permissions

paths-ignore:
  - '**/test/**'
  - '**/tests/**'
  - '**/__test__/**'
  - '**/__tests__/**'
  - '**/*.test.*'
  # Generated by Mock Service Worker (dev/test mocks only; "do NOT modify"). Flags
  # js/missing-origin-check, but a service worker only receives messages from
  # same-origin clients, so it isn't exploitable.
  - '**/public/mockServiceWorker.js'
